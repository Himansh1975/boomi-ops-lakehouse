<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Blast Radius</title>
<meta name="description" content="Boomi component lineage: what breaks if you change it, weighted by real runs.">
<style>
  :root {
    --bg: #f6f5f1; --canvas: #fbfaf7; --panel: #ffffff; --card: #ffffff; --ink: #1c1b18; --ink-2: #4a4944;
    --muted: #7a7870; --line: #e6e4dc; --line-2: #d6d3c9; --dot: #dedbd1;
    --accent: #d9480f; --accent-ink: #b33a08; --accent-soft: #fff1e8; --accent-line: #f7c3a6;
    --ok: #2f9e44; --bad: #e03131; --bad-soft: #ffe8e8; --warn: #e8590c;
    --k-process: #3b5bdb; --k-subprocess: #0c8599; --k-map: #2f9e44; --k-operation: #ae7c09;
    --k-connection: #e8590c; --k-profile: #7048e8; --k-other: #6c757d; --k-deleted: #adb5bd;
    --shadow: 0 1px 2px rgba(28, 27, 24, .06), 0 2px 8px rgba(28, 27, 24, .05);
    --shadow-lift: 0 4px 18px rgba(28, 27, 24, .12);
    --edge: #c9c6bb; --dim: .16;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #121211; --canvas: #161615; --panel: #1b1b19; --card: #222220; --ink: #eeede8; --ink-2: #c9c7bf;
      --muted: #8f8d85; --line: #2e2d2a; --line-2: #3a3935; --dot: #2a2927;
      --accent: #ff8a4c; --accent-ink: #ffa26f; --accent-soft: #3a2116; --accent-line: #6b3518;
      --ok: #51cf66; --bad: #ff6b6b; --bad-soft: #3b1d1d; --warn: #ff922b;
      --k-process: #748ffc; --k-subprocess: #3bc9db; --k-map: #69db7c; --k-operation: #fcc419;
      --k-connection: #ff922b; --k-profile: #9775fa; --k-other: #adb5bd; --k-deleted: #6c757d;
      --shadow: 0 1px 2px rgba(0, 0, 0, .4); --shadow-lift: 0 6px 22px rgba(0, 0, 0, .55);
      --edge: #45443f; --dim: .14;
    }
  }
  :root[data-theme="dark"] {
    --bg: #121211; --canvas: #161615; --panel: #1b1b19; --card: #222220; --ink: #eeede8; --ink-2: #c9c7bf;
    --muted: #8f8d85; --line: #2e2d2a; --line-2: #3a3935; --dot: #2a2927;
    --accent: #ff8a4c; --accent-ink: #ffa26f; --accent-soft: #3a2116; --accent-line: #6b3518;
    --ok: #51cf66; --bad: #ff6b6b; --bad-soft: #3b1d1d; --warn: #ff922b;
    --k-process: #748ffc; --k-subprocess: #3bc9db; --k-map: #69db7c; --k-operation: #fcc419;
    --k-connection: #ff922b; --k-profile: #9775fa; --k-other: #adb5bd; --k-deleted: #6c757d;
    --shadow: 0 1px 2px rgba(0, 0, 0, .4); --shadow-lift: 0 6px 22px rgba(0, 0, 0, .55);
    --edge: #45443f; --dim: .14;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body { background: var(--bg); color: var(--ink); display: grid; grid-template-rows: auto 1fr; grid-template-columns: minmax(0, 1fr); overflow: hidden;
         font: 14px/1.45 ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
         font-variant-numeric: tabular-nums; -webkit-font-smoothing: antialiased; }
  button { font: inherit; color: inherit; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  /* ---- header ---- */
  header { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 18px; padding: 10px 16px;
           background: var(--panel); border-bottom: 1px solid var(--line); position: relative; z-index: 5; }
  .brand { display: flex; align-items: center; gap: 10px; }
  .brand svg { flex: none; }
  .brand h1 { font-size: 16px; margin: 0; letter-spacing: -.01em; white-space: nowrap; }
  .brand h1 b { color: var(--accent); }
  .chip { display: inline-flex; align-items: center; gap: 6px; padding: 3px 9px; border-radius: 999px;
          border: 1px solid var(--line); color: var(--muted); font-size: 12px; white-space: nowrap; background: var(--panel); }
  .chip strong { color: var(--ink); font-weight: 600; }
  button.chip { cursor: pointer; }
  button.chip:hover { border-color: var(--line-2); color: var(--ink-2); }
  .chip.src { text-transform: uppercase; letter-spacing: .06em; font-size: 10.5px; font-weight: 700; color: var(--accent-ink);
              background: var(--accent-soft); border-color: var(--accent-line); }
  .chip.warnchip strong { color: var(--warn); }
  .stats { display: flex; flex-wrap: wrap; gap: 6px; }
  .tools { display: flex; align-items: center; gap: 8px; margin-left: auto; }
  .search { position: relative; }
  .search input { width: 260px; padding: 7px 34px 7px 32px; border-radius: 9px; border: 1px solid var(--line);
                  background: var(--bg); color: var(--ink); font: inherit; }
  .search input::placeholder { color: var(--muted); }
  .search .ico { position: absolute; left: 10px; top: 50%; transform: translateY(-50%); color: var(--muted); pointer-events: none; }
  .search kbd { position: absolute; right: 8px; top: 50%; transform: translateY(-50%); }
  kbd { font: 11px ui-monospace, SFMono-Regular, Consolas, monospace; color: var(--muted); border: 1px solid var(--line-2);
        border-bottom-width: 2px; border-radius: 5px; padding: 0 5px; background: var(--panel); }
  .results { position: absolute; top: calc(100% + 6px); left: 0; right: 0; max-height: 340px; overflow: auto;
             background: var(--panel); border: 1px solid var(--line); border-radius: 10px; box-shadow: var(--shadow-lift);
             padding: 4px; display: none; }
  .results.open { display: block; }
  .results button { display: flex; width: 100%; align-items: center; gap: 9px; padding: 7px 8px; border: 0; background: none;
                    border-radius: 7px; cursor: pointer; text-align: left; }
  .results button[aria-selected="true"], .results button:hover { background: var(--accent-soft); }
  .results small { color: var(--muted); margin-left: auto; white-space: nowrap; }
  .seg { display: inline-flex; padding: 2px; border-radius: 9px; background: var(--bg); border: 1px solid var(--line); }
  .seg button { border: 0; background: none; padding: 5px 10px; border-radius: 7px; cursor: pointer; color: var(--muted); white-space: nowrap; }
  .seg button[aria-pressed="true"] { background: var(--panel); color: var(--ink); box-shadow: var(--shadow); font-weight: 600; }
  .iconbtn { display: inline-grid; place-items: center; width: 34px; height: 34px; border-radius: 9px; border: 1px solid var(--line);
             background: var(--panel); cursor: pointer; color: var(--ink-2); }
  .iconbtn:hover { border-color: var(--line-2); color: var(--ink); }
  .iconbtn[aria-pressed="true"] { background: var(--accent-soft); color: var(--accent-ink); border-color: var(--accent-line); }

  /* ---- layout ---- */
  main { display: grid; grid-template-columns: minmax(0, 1fr) 380px; min-height: 0; }
  .boot *, .boot #stage { transition: none !important; }
  #viewport { position: relative; overflow: hidden; background-color: var(--canvas); cursor: grab; touch-action: none;
              background-image: radial-gradient(var(--dot) 1px, transparent 1px); background-size: 20px 20px; }
  #viewport.panning { cursor: grabbing; }
  #stage { position: absolute; left: 0; top: 0; transform-origin: 0 0; }
  #stage.animate { transition: transform .45s cubic-bezier(.2, .7, .2, 1); }
  #edges { position: absolute; left: 0; top: 0; overflow: visible; pointer-events: none; }
  .cols { position: absolute; left: 0; top: 0; pointer-events: none; }
  .colhead { position: absolute; white-space: nowrap; font-size: 11px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--muted);
             transition: opacity .3s; }

  /* ---- edges ---- */
  path.e { fill: none; stroke: var(--edge); stroke-width: 1.4; transition: opacity .3s, stroke .3s; }
  path.e.drift { stroke: var(--bad); stroke-dasharray: 5 4; }
  path.e.hit { stroke: var(--accent); stroke-width: 2.4; stroke-dasharray: 7 6; animation: flow 0.9s linear infinite; }
  path.e.hit.rev { animation-direction: reverse; }
  path.e.dim { opacity: var(--dim); }
  path.e.gone { opacity: 0; }
  @keyframes flow { to { stroke-dashoffset: -13; } }
  #arr path { fill: var(--edge); } #arrh path { fill: var(--accent); } #arrd path { fill: var(--bad); }

  /* ---- node cards ---- */
  .n { position: absolute; width: 212px; height: 52px; display: flex; align-items: center; gap: 9px; padding: 0 10px 0 8px;
       background: var(--card); border: 1px solid var(--line); border-radius: 11px; box-shadow: var(--shadow); cursor: pointer;
       transition: opacity .3s, box-shadow .2s, border-color .2s, transform .2s; user-select: none; overflow: hidden; }
  .n:hover { box-shadow: var(--shadow-lift); border-color: var(--line-2); transform: translateY(-1px); }
  .n .ic { flex: none; width: 30px; height: 30px; border-radius: 8px; display: grid; place-items: center; color: #fff; }
  .n .tx { min-width: 0; flex: 1; }
  .n .nm { font-weight: 600; font-size: 12.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: var(--ink); }
  .n .mt { font-size: 11px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .n .mt .bad { color: var(--bad); font-weight: 600; }
  .n .health { position: absolute; left: 0; right: 0; bottom: 0; height: 3px; background: color-mix(in srgb, var(--ok) 55%, transparent); }
  .n .health i { display: block; height: 100%; background: var(--bad); }
  .n .tag { flex: none; font-size: 9.5px; font-weight: 700; letter-spacing: .05em; text-transform: uppercase; padding: 1px 5px;
            border-radius: 4px; background: var(--bad-soft); color: var(--bad); }
  .n.orphan { border-style: dashed; }
  .n.deleted { border-style: dashed; opacity: .7; }
  .n.deleted .nm { font-style: italic; font-weight: 500; }
  .n.dim { opacity: var(--dim); }
  .n.gone { opacity: 0; pointer-events: none; }
  .n.hit { border-color: var(--accent-line); }
  .n.focus { border: 2px solid var(--accent); box-shadow: 0 0 0 5px color-mix(in srgb, var(--accent) 18%, transparent), var(--shadow-lift); }
  .n.ctx { opacity: .55; }

  /* ---- zoom controls ---- */
  .zoom { position: absolute; left: 14px; bottom: 14px; display: flex; flex-direction: column; gap: 4px; z-index: 2; }
  .hintbar { position: absolute; left: 60px; bottom: 16px; font-size: 12px; color: var(--muted); z-index: 2; pointer-events: none; }
  .hintbar kbd { margin: 0 2px; }
  .tourbar { position: absolute; left: 50%; top: 14px; transform: translateX(-50%); z-index: 3; display: none; align-items: center; gap: 10px;
             padding: 7px 12px; border-radius: 999px; background: var(--panel); border: 1px solid var(--line); box-shadow: var(--shadow-lift); font-size: 13px; }
  .tourbar.on { display: flex; }
  .tourbar .bar { width: 90px; height: 4px; border-radius: 4px; background: var(--line); overflow: hidden; }
  .tourbar .bar i { display: block; height: 100%; width: 0; background: var(--accent); }

  /* ---- side panel ---- */
  aside { background: var(--panel); border-left: 1px solid var(--line); overflow: auto; padding: 18px 18px 28px; }
  .eyebrow { display: flex; align-items: center; gap: 7px; font-size: 11px; font-weight: 700; letter-spacing: .07em; text-transform: uppercase; color: var(--muted); }
  .eyebrow .sw { width: 9px; height: 9px; border-radius: 3px; }
  aside h2 { margin: 6px 0 2px; font-size: 19px; line-height: 1.25; letter-spacing: -.01em; word-break: break-word; }
  .sub { color: var(--muted); font-size: 12.5px; }
  .callout { margin: 14px 0; padding: 12px 14px; border-radius: 11px; background: var(--accent-soft); border: 1px solid var(--accent-line);
             color: var(--ink); font-size: 14px; }
  .callout b { color: var(--accent-ink); }
  .callout.calm { background: var(--bg); border-color: var(--line); }
  .tiles { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin: 12px 0 6px; }
  .tile { border: 1px solid var(--line); border-radius: 11px; padding: 10px 12px; background: var(--bg); }
  .tile .v { font-size: 22px; font-weight: 700; letter-spacing: -.02em; line-height: 1.1; }
  .tile .l { font-size: 11.5px; color: var(--muted); margin-top: 2px; }
  .tile.bad .v { color: var(--bad); }
  .badges { display: flex; flex-wrap: wrap; gap: 6px; margin: 8px 0; }
  .badge { font-size: 11.5px; padding: 2px 8px; border-radius: 999px; border: 1px solid var(--line); color: var(--ink-2); }
  .badge.bad { background: var(--bad-soft); border-color: transparent; color: var(--bad); }
  aside h3 { display: flex; align-items: baseline; gap: 8px; margin: 20px 0 8px; font-size: 11.5px; letter-spacing: .07em; text-transform: uppercase; color: var(--muted); }
  aside h3 .act { margin-left: auto; text-transform: none; letter-spacing: 0; font-weight: 500; }
  .rows { list-style: none; margin: 0; padding: 0; display: grid; gap: 2px; }
  .rows li > button, .rows li > div { display: grid; grid-template-columns: 22px 1fr auto; align-items: center; gap: 9px; width: 100%;
                                       padding: 7px 8px; border: 0; background: none; border-radius: 8px; text-align: left; }
  .rows li > button { cursor: pointer; }
  .rows li > button:hover { background: var(--bg); }
  .rows .mini { width: 22px; height: 22px; border-radius: 6px; display: grid; place-items: center; color: #fff; }
  .rows .nm { font-weight: 600; font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .rows .mt { font-size: 11.5px; color: var(--muted); }
  .rows .num { font-size: 12px; color: var(--ink-2); text-align: right; white-space: nowrap; }
  .rows .num .bad { color: var(--bad); font-weight: 600; }
  .rbar { grid-column: 2 / 4; height: 4px; border-radius: 4px; background: var(--line); overflow: hidden; display: flex; margin-top: -2px; }
  .rbar i { display: block; height: 100%; }
  .linkbtn { border: 0; background: none; color: var(--accent-ink); cursor: pointer; padding: 0; font-size: 12.5px; }
  .linkbtn:hover { text-decoration: underline; }
  .formula { font-size: 12px; color: var(--muted); margin-top: 6px; }
  .legend { display: grid; grid-template-columns: 1fr 1fr; gap: 6px 14px; font-size: 12px; color: var(--ink-2); }
  .legend span { display: flex; align-items: center; gap: 7px; }
  .legend i { width: 18px; height: 18px; border-radius: 5px; display: grid; place-items: center; color: #fff; flex: none; }
  .empty { color: var(--muted); font-size: 13px; }
  .hero { font-size: 20px; font-weight: 700; letter-spacing: -.015em; line-height: 1.25; margin: 4px 0 6px; }

  @media (max-width: 900px) {
    body { overflow: auto; grid-template-rows: auto auto; }
    main { grid-template-columns: minmax(0, 1fr); grid-template-rows: 62vh auto; }
    aside { border-left: 0; border-top: 1px solid var(--line); }
    .tools { margin-left: 0; width: 100%; flex-wrap: wrap; }
    .search { flex: 1 1 100%; } .search input { width: 100%; }
    .seg { flex: 1; } .seg button { flex: 1; }
    .hintbar { display: none; }
  }
  @media (prefers-reduced-motion: reduce) {
    #stage.animate, .n, path.e { transition: none; }
    path.e.hit { animation: none; }
  }
</style>
</head>
<body>
<header>
  <div class="brand">
    <svg width="26" height="26" viewBox="0 0 26 26" aria-hidden="true"><circle cx="13" cy="13" r="12" fill="none" stroke="var(--accent)" stroke-width="1.5" opacity=".35"/><circle cx="13" cy="13" r="7.5" fill="none" stroke="var(--accent)" stroke-width="1.5" opacity=".65"/><circle cx="13" cy="13" r="3.2" fill="var(--accent)"/></svg>
    <h1>Blast <b>Radius</b></h1>
    <span class="chip src" id="src"></span>
  </div>
  <div class="stats" id="stats"></div>
  <div class="tools">
    <div class="search">
      <svg class="ico" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input id="q" type="search" placeholder="Find a component" autocomplete="off" role="combobox" aria-expanded="false" aria-controls="results" aria-label="Find a component">
      <kbd>/</kbd>
      <div class="results" id="results" role="listbox"></div>
    </div>
    <div class="seg" role="group" aria-label="Direction">
      <button id="m-impact" aria-pressed="true" title="Everything that depends on the selected component">What breaks</button>
      <button id="m-deps" aria-pressed="false" title="Everything the selected component needs">What it uses</button>
    </div>
    <button class="iconbtn" id="tour" title="Tour the riskiest components (T)" aria-pressed="false" aria-label="Tour">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M7 4.5v15l12-7.5z"/></svg>
    </button>
    <button class="iconbtn" id="theme" title="Light / dark" aria-label="Switch light or dark theme">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M12 3a9 9 0 1 0 9 9 7 7 0 0 1-9-9z"/></svg>
    </button>
  </div>
</header>
<main>
  <div id="viewport" aria-label="Lineage graph">
    <div id="stage"><div class="cols" id="cols"></div><svg id="edges"></svg><div id="nodes"></div></div>
    <div class="tourbar" id="tourbar"><span id="tourtext"></span><span class="bar"><i id="tourprog"></i></span>
      <button class="linkbtn" id="tourstop">Stop</button></div>
    <div class="zoom">
      <button class="iconbtn" id="zin" aria-label="Zoom in" title="Zoom in">+</button>
      <button class="iconbtn" id="zout" aria-label="Zoom out" title="Zoom out">−</button>
      <button class="iconbtn" id="zfit" aria-label="Fit to screen" title="Fit (F)">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg></button>
    </div>
    <div class="hintbar"><kbd>/</kbd> search · <kbd>Esc</kbd> back · <kbd>F</kbd> fit · drag to pan, scroll to zoom</div>
  </div>
  <aside id="panel" aria-live="polite"></aside>
</main>
<script>
const DATA = /*__LINEAGE_DATA__*/null;

/* ---------- constants ---------- */
const COLS = ["process", "subprocess", "map", "operation", "connection", "profile"];
const COL_OF = { process: 0, subprocess: 1, map: 2, operation: 3, connection: 4, profile: 5, other: 5, deleted: 5 };
const LABEL = { process: "Process", subprocess: "Sub-process", map: "Map", operation: "Operation",
                connection: "Connection", profile: "Profile", other: "Component", deleted: "Deleted" };
const COL_TITLE = ["Processes", "Sub-processes", "Maps", "Operations", "Connections", "Profiles"];
const W = 212, H = 52, GAP_X = 300, GAP_Y = 70;
const ICON = {
  process: '<path d="M4 7h10M4 12h16M4 17h10"/><path d="m16 5 3 2-3 2M16 15l3 2-3 2"/>',
  subprocess: '<rect x="4" y="5" width="16" height="14" rx="3"/><path d="M9 12h6m-2-2 2 2-2 2"/>',
  map: '<path d="M4 7h6l4 10h6M4 17h6l1.5-3.75M14 7h6"/>',
  operation: '<path d="M13 3 5 14h6l-1 7 8-11h-6z"/>',
  connection: '<path d="M9 7V3m6 4V3M7 7h10v4a5 5 0 0 1-10 0zM12 16v5"/>',
  profile: '<path d="M7 4h7l4 4v12H7z"/><path d="M14 4v4h4M10 13h5M10 17h5"/>',
  other: '<circle cx="12" cy="12" r="6"/>',
  deleted: '<path d="M5 7h14M10 7V5h4v2m-7 0 1 12h8l1-12"/>',
};
const icon = (k, s = 16) => `<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${ICON[k] || ICON.other}</svg>`;
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const fmt = n => (n || 0).toLocaleString("en-US");
const plural = (n, w) => `${fmt(n)} ${w}${n === 1 ? "" : (/(s|sh|ch|x)$/.test(w) ? "es" : "s")}`;
const $ = id => document.getElementById(id);
const store = { get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
                set(k, v) { try { localStorage.setItem(k, v); } catch (e) { /* private mode */ } } };

/* ---------- graph ---------- */
const nodes = DATA.nodes.map(n => ({ ...n }));
const byId = Object.fromEntries(nodes.map(n => [n.id, n]));
const edges = DATA.edges.filter(e => byId[e.source] && byId[e.target])
  .map(e => ({ ...e, drift: e.dangling || e.inApi !== e.inXml }));
const out = {}, inn = {};
for (const e of edges) { (out[e.source] ||= []).push(e); (inn[e.target] ||= []).push(e); }
function reach(id, up) {
  const seen = new Map(), q = [[id, 0]];
  while (q.length) {
    const [cur, d] = q.shift();
    for (const e of (up ? inn[cur] : out[cur]) || []) {
      const nx = up ? e.source : e.target;
      if (nx !== id && !seen.has(nx)) { seen.set(nx, d + 1); q.push([nx, d + 1]); }
    }
  }
  return seen;
}

// top-level processes that depend on each component: the number every card and panel shows
for (const n of nodes) n.users = n.kind === "process" ? 0 : [...reach(n.id, true).keys()].filter(i => byId[i].kind === "process").length;

/* ---------- layout: columns by kind, rows ordered to cut crossings (barycentre sweeps) ---------- */
function layout(ids) {
  const set = new Set(ids), cols = COLS.map(() => []);
  for (const id of ids) cols[COL_OF[byId[id].kind] ?? 5].push(id);
  cols[0].sort((a, b) => (byId[b].runs || 0) - (byId[a].runs || 0) || byId[a].name.localeCompare(byId[b].name));

const q = $("q"), results = $("results");
let hits = [], active = 0;
function search() {
  const s = q.value.trim().toLowerCase();
  hits = !s ? [] : nodes.filter(n => n.kind !== "deleted" && n.name.toLowerCase().includes(s))
    .sort((a, b) => (a.name.toLowerCase().startsWith(s) ? 0 : 1) - (b.name.toLowerCase().startsWith(s) ? 0 : 1) || a.name.localeCompare(b.name)).slice(0, 12);
  active = 0;
  results.innerHTML = hits.map((n, i) => `<button role="option" aria-selected="${i === active}" data-i="${i}">
    <span class="mini" style="background:var(--k-${n.kind});width:20px;height:20px;border-radius:6px;display:grid;place-items:center;color:#fff">${icon(n.kind, 12)}</span>
    ${esc(n.name)}<small>${LABEL[n.kind]}</small></button>`).join("") || (s ? `<div class="empty" style="padding:8px">No match</div>` : "");
  results.classList.toggle("open", !!s); q.setAttribute("aria-expanded", !!s);
  results.querySelectorAll("button").forEach(b => b.onmousedown = ev => { ev.preventDefault(); pick(+b.dataset.i); });
}
function pick(i) { const n = hits[i]; if (!n) return; q.value = ""; search(); q.blur(); select(n.id); }
q.addEventListener("input", search);
q.addEventListener("keydown", ev => {
  if (ev.key === "ArrowDown" || ev.key === "ArrowUp") {
    ev.preventDefault(); active = (active + (ev.key === "ArrowDown" ? 1 : -1) + hits.length) % Math.max(1, hits.length);
    results.querySelectorAll("button").forEach((b, i) => b.setAttribute("aria-selected", i === active));
  } else if (ev.key === "Enter") { ev.preventDefault(); pick(active); }
  else if (ev.key === "Escape") { q.value = ""; search(); q.blur(); }
});
q.addEventListener("blur", () => setTimeout(() => results.classList.remove("open"), 120));

/* ---------- tour (for demos and recordings) ---------- */
let tourTimer = null, tourIdx = 0, tourStart = 0;
const TOUR_MS = 4200;
function tourList() {
  return nodes.filter(n => !["process", "deleted"].includes(n.kind) && n.users > 0)
    .sort((a, b) => (b.risk || 0) - (a.risk || 0)).slice(0, 5).map(n => n.id);
}
function startTour() {
  const list = tourList(); if (!list.length) return;
  $("tour").setAttribute("aria-pressed", "true"); $("tourbar").classList.add("on");
  if (mode !== "impact") setMode("impact");
  tourIdx = 0;
  const show = () => {
    const id = list[tourIdx % list.length];
    select(id, { keepTour: true });
    $("tourtext").textContent = `${tourIdx % list.length + 1}/${list.length} · ${byId[id].name}`;
    tourStart = performance.now(); tourIdx++;
  };
  show();
  tourTimer = setInterval(() => {
    const t = (performance.now() - tourStart) / TOUR_MS;
    $("tourprog").style.width = `${Math.min(1, t) * 100}%`;
    if (t >= 1) show();
  }, 50);
}
function stopTour() {
  if (!tourTimer) return;
  clearInterval(tourTimer); tourTimer = null;
  $("tour").setAttribute("aria-pressed", "false"); $("tourbar").classList.remove("on");
}
$("tour").onclick = () => tourTimer ? stopTour() : startTour();
$("tourstop").onclick = stopTour;

/* ---------- theme, keys, boot ---------- */
function setTheme(t) { document.documentElement.dataset.theme = t; store.set("br-theme", t); }
$("theme").onclick = () => {
  const dark = document.documentElement.dataset.theme ? document.documentElement.dataset.theme === "dark"
                                                       : matchMedia("(prefers-color-scheme: dark)").matches;
  setTheme(dark ? "light" : "dark");
};
const urlTheme = new URLSearchParams(location.search).get("theme");
const saved = ["light", "dark"].includes(urlTheme) ? urlTheme : store.get("br-theme");
if (saved) document.documentElement.dataset.theme = saved;
$("m-impact").onclick = () => setMode("impact");
$("m-deps").onclick = () => setMode("deps");
document.addEventListener("keydown", ev => {
  if (ev.target === q) return;
  if (ev.key === "/") { ev.preventDefault(); q.focus(); }
  else if (ev.key === "Escape") { stopTour(); clearSel(); }
  else if (ev.key === "f" || ev.key === "F") fit(shown);
  else if (ev.key === "t" || ev.key === "T") tourTimer ? stopTour() : startTour();
});
new ResizeObserver(() => fit(shown, false)).observe(vp);

build(); stats();
cur = { ...layoutAll.coords }; target = { ...layoutAll.coords }; draw(); drawHeads(layoutAll.heads, layoutAll.coords);
const params = new URLSearchParams(location.search);
if (params.get("mode") === "deps") setMode("deps");
const start = params.get("component");
const startNode = start && (byId[start] || nodes.find(n => n.name.toLowerCase() === start.toLowerCase()));
// opened from a link: place everything at once (no animation from nowhere), then allow transitions
document.body.classList.add("boot");
if (startNode) select(startNode.id, { instant: true }); else { overview(); fit(shown, false); }
requestAnimationFrame(() => requestAnimationFrame(() => document.body.classList.remove("boot")));
if (params.get("tour") === "1") startTour();
</script>
</body>
