name: ci
on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: src
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with: { distribution: temurin, java-version: "17" }
      - uses: actions/setup-python@v7
        with: { python-version: "3.11" }
      - run: pip install -r requirements.txt
      - name: Unit + Spark tests
        run: pytest -q
      - name: Replay four days end to end (no Boomi account needed)
        run: python -m boomi_ops.run --data-root data replay --start 2026-11-01 --days 4 --transform end
      - name: Lineage report
        run: python -m boomi_ops.run --data-root data lineage show
      - name: Build the Blast Radius viewer from replay data
        run: python -m boomi_ops.run --data-root data lineage viewer --source replay --out site/index.html
      - name: Upload viewer for GitHub Pages
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v5
        with: { path: site }

  pages:
    # needs Settings > Pages > Source = "GitHub Actions" (one-time, in the repo settings)
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: test
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v5
